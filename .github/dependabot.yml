version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Major jumps (language/runtime/toolchain versions, TypeScript, ...) are done by hand with a plan and the full suite.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Major jumps (language/runtime/toolchain versions, TypeScript, ...) are done by hand with a plan and the full suite.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Major jumps (language/runtime/toolchain versions, TypeScript, ...) are done by hand with a plan and the full suite.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Major jumps (language/runtime/toolchain versions, TypeScript, ...) are done by hand with a plan and the full suite.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-frontend-minor-patch:
        update-types: [minor, patch]
