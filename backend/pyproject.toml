[project]
name = "rag-pipeline-backend"
version = "0.1.0"
description = "Enterprise-grade, deployable RAG pipeline — FastAPI API + Celery workers (ingest → parse → chunk → embed → store → query)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aayush Joshi" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.17",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31",
    "psycopg[binary]>=3.3",
    "alembic>=1.18",
    "celery>=5.4",
    "redis>=5.0",
    "chromadb-client>=0.6",
    "openai>=1.58",
    "anthropic>=0.40",
    # PDF page count, native text layer and page renders (Apache-2.0 / BSD-3). Replaces PyMuPDF (AGPL-3.0), ADR-0002.
    "pypdfium2>=4.30",
    # DOCX → markdown only: docling-slim + the Word backend. The full `docling` package pulls in
    # torch and layout/OCR models (GBs) that DOCX conversion never uses.
    "docling-slim[format-docx,format-pdf-pypdfium2]>=2.3",
    "pytesseract>=0.3.13",
    "Pillow>=11.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "langfuse>=4",
    "pgvector>=0.5.0",
    "pyjwt>=2.8",
    "boto3>=1.44.3",
    "cryptography>=50.0.2",
    # imported directly by the URL fetcher, credits, health probe and Ollama embedder (also a transitive dep of
    # openai/anthropic/chromadb-client, but a runtime import must not depend on that).
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
src = ["app", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"app/routers/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "app"
packages = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["no_enc_key: run without SETTINGS_ENCRYPTION_KEY set"]
