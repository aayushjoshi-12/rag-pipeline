x-backend-env: &backend-env
  # `.env` holds localhost URLs for host-run development; inside containers the services are
  # reached by their Compose hostnames. These override env_file values.
  DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  # Ollama runs on the host (see README); host.docker.internal reaches it from the containers.
  OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
  DATA_DIR: /app/data
  # Auth: values come from the shell or .env (never hard-coded here).
  AUTH_ENABLED: ${AUTH_ENABLED:-true}
  SECRET_KEY: ${SECRET_KEY:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  # File storage / URL ingest (docs/configuration.md). Defaults reproduce the pre-ticket-22
  # behaviour (local disk); set them in the shell or .env, e.g. for the `s3` profile (MinIO).
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_DOCKER:-${S3_ENDPOINT_URL:-}}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_PREFIX: ${S3_PREFIX:-rag-pipeline/}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  URL_INGEST_ALLOW_PRIVATE: ${URL_INGEST_ALLOW_PRIVATE:-false}
  PARSE_NORMALIZE_TEXT: ${PARSE_NORMALIZE_TEXT:-true}

x-backend: &backend
  # One tag shared by api/worker/beat/migrate so Compose builds the backend image once.
  image: rag-pipeline-backend:local
  build:
    context: ./backend
  env_file: .env
  environment: *backend-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - appdata:/app/data

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-pipeline-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rag-pipeline-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    container_name: rag-pipeline-chroma
    ports:
      - "8001:8000"
    volumes:
      # chromadb/chroma persists to /data (not /chroma/chroma): mounting the volume elsewhere silently
      # kept every vector in the container's writable layer, lost on any recreate.
      - chroma-data:/data

  # Optional S3-compatible object store (real MinIO) for STORAGE_BACKEND=s3 / s3:// ingest. Only started
  # with `docker compose --profile s3 up`; the default `docker compose up` is unchanged.
  # Image: MinIO no longer publishes to Docker Hub/Quay, so the default is the last public Bitnami
  # build (MinIO 2025.5.24, frozen); override with MINIO_IMAGE (e.g. your own mirror of minio/minio).
  # Dev credentials only: override MINIO_ROOT_USER / MINIO_ROOT_PASSWORD outside a laptop.
  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    container_name: rag-pipeline-minio
    profiles: ["s3"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-rag-documents}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *backend
    container_name: rag-pipeline-migrate
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    container_name: rag-pipeline-api
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    container_name: rag-pipeline-worker
    command: celery -A app.celery_app worker --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: unless-stopped

  beat:
    <<: *backend
    container_name: rag-pipeline-beat
    command: celery -A app.celery_app beat --loglevel=INFO -s /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: rag-pipeline-frontend
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  appdata:
  pgdata:
  chroma-data:
  minio-data: