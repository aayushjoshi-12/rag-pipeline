x-backend-env: &backend-env
  # `.env` holds localhost URLs for host-run development; inside containers the services are
  # reached by their Compose hostnames. These override env_file values.
  DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  # Query cache (ticket 37): same Redis, its own db so a purge never touches Celery keys.
  CACHE_REDIS_URL: redis://redis:6379/12
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  # Ollama runs on the host (see README); host.docker.internal reaches it from the containers.
  OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
  DATA_DIR: /app/data
  # Auth: values come from the shell or .env (never hard-coded here).
  AUTH_ENABLED: ${AUTH_ENABLED:-true}
  SECRET_KEY: ${SECRET_KEY:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  # File storage / URL ingest (docs/configuration.md). Defaults reproduce the pre-ticket-22
  # behaviour (local disk); set them in the shell or .env, e.g. for the `s3` profile (Floci).
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL_DOCKER:-${S3_ENDPOINT_URL:-}}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_PREFIX: ${S3_PREFIX:-rag-pipeline/}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  URL_INGEST_ALLOW_PRIVATE: ${URL_INGEST_ALLOW_PRIVATE:-false}
  PARSE_NORMALIZE_TEXT: ${PARSE_NORMALIZE_TEXT:-true}

x-backend: &backend
  # One tag shared by api/worker/beat/migrate so Compose builds the backend image once.
  image: rag-pipeline-backend:local
  build:
    context: ./backend
  env_file: .env
  environment: *backend-env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - appdata:/app/data

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped  # data services come back after a Docker/host restart
    container_name: rag-pipeline-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped  # data services come back after a Docker/host restart
    container_name: rag-pipeline-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9  # pinned (ticket 52): chroma/config.yaml records why
    restart: unless-stopped  # data services come back after a Docker/host restart
    container_name: rag-pipeline-chroma
    ports:
      - "8001:8000"
    volumes:
      # chromadb/chroma persists to /data (not /chroma/chroma): mounting the volume elsewhere silently
      # kept every vector in the container's writable layer, lost on any recreate.
      - chroma-data:/data
      # Bounds the HNSW index cache (ticket 48): the default leaks ~3 MiB per collection ever written, so repeated
      # reindexes ran the server to GBs. Same persist_path as the image's own /config.yaml.
      - ./chroma/config.yaml:/config.yaml:ro
    # A runaway container is OOM-killed on its own (and restarted) instead of the VM killing a random one.
    # Sizing and measurements: docs/configuration.md "Memory".
    mem_limit: 1536m
    mem_reservation: 512m

  # Throwaway Chroma for the test suite (ticket 50): `make check` starts it, runs the Chroma-using tests against it
  # (CHROMA_TEST_HOST/PORT, default localhost:8002) and removes it, so tests never create collections in the dev
  # Chroma above. Same pinned image and config; no volume (tmpfs), memory-capped. Start by hand: `make chroma-test-up`.
  chroma-test:
    image: chromadb/chroma:1.5.9
    container_name: rag-pipeline-chroma-test
    profiles: ["test"]
    ports:
      - "8002:8000"
    tmpfs:
      - /data
    volumes:
      - ./chroma/config.yaml:/config.yaml:ro
    mem_limit: 768m

  # Optional local S3 emulator for STORAGE_BACKEND=s3 / s3:// ingest. Only started with
  # `docker compose --profile s3 up -d floci floci-init` (the default `docker compose up` is unchanged).
  # Floci is a free (MIT) AWS emulator: ~40 MiB idle, S3 on :4566, any credentials are accepted (dev only).
  # Containers reach it as http://floci:4566 (set S3_ENDPOINT_URL_DOCKER); host tools use http://localhost:4566.
  floci:
    image: ${FLOCI_IMAGE:-floci/floci:latest}
    container_name: rag-pipeline-floci
    profiles: ["s3"]
    ports:
      - "4566:4566"

  # One-shot: creates the bucket ($S3_BUCKET, default rag-documents) on the emulator; safe to re-run.
  floci-init:
    <<: *backend
    container_name: rag-pipeline-floci-init
    profiles: ["s3"]
    command: python -m app.manage ensure-bucket --wait 60
    environment:
      <<: *backend-env
      S3_ENDPOINT_URL: http://floci:4566
      S3_BUCKET: ${S3_BUCKET:-rag-documents}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
    depends_on:
      floci:
        condition: service_started
    restart: "no"

  migrate:
    <<: *backend
    container_name: rag-pipeline-migrate
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    container_name: rag-pipeline-api
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 256m

  worker:
    <<: *backend
    container_name: rag-pipeline-worker
    command: celery -A app.celery_app worker --loglevel=INFO
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: unless-stopped
    # idle ~445 MiB with WORKER_CONCURRENCY=2; a 200-page scan peaks ~280 MiB more (pages render one at a time)
    mem_limit: 3g
    mem_reservation: 512m

  beat:
    <<: *backend
    container_name: rag-pipeline-beat
    command: celery -A app.celery_app beat --loglevel=INFO -s /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # idle ~176 MiB, cold-start peak ~180 MiB (ticket 52: it imports every task module through `include=`)
    mem_limit: 384m
    mem_reservation: 192m

  frontend:
    # Optional dashboard. `make up` enables the "ui" profile; `make up-api` (API only) does not.
    profiles: ["ui"]
    build:
      context: ./frontend
    container_name: rag-pipeline-frontend
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  appdata:
  pgdata:
  chroma-data:
