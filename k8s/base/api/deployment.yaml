apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-pipeline-api
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Service-link env vars (CHROMA_PORT=tcp://...) collide with CHROMA_*/REDIS_* settings; we use DNS.
      enableServiceLinks: false
      # `kubectl apply -k` starts the api together with Postgres and the migrate Job. The api seeds the built-in
      # roles and the bootstrap admin once, at startup, and does not retry: if the tables are not there yet the
      # pod comes up healthy but nobody can log in (found on a real cluster). Hold the api until Alembic is at head.
      initContainers:
        - name: wait-for-migrate
          image: rag-pipeline/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 300); do
                alembic current 2>/dev/null | grep -q '(head)' && exit 0
                sleep 2
              done
              echo "database is not migrated to head (is the rag-pipeline-migrate Job running?)" >&2
              exit 1
          envFrom:
            - configMapRef:
                name: rag-pipeline-config
            - secretRef:
                name: rag-pipeline-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {cpu: 250m, memory: 384Mi}
      containers:
        - name: api
          image: rag-pipeline/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: rag-pipeline-config
            - secretRef:
                name: rag-pipeline-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/data
          # /health is 503 when db/redis/chroma are down: don't route traffic then (readiness),
          # but only restart on a hung process (liveness hits the same cheap endpoint with slack).
          # /health also pings Ollama/Chroma/DB, so the default timeoutSeconds: 1 produced "context deadline
          # exceeded" probe failures while a kind node was still pulling images (ticket 49): every probe sets 5 s,
          # and the startupProbe gives a cold start up to 5 min (60 x 5 s) before liveness/readiness take over.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: rag-pipeline-uploads
