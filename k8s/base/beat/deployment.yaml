# Exactly one beat: two would double-fire every scheduled task. Recreate avoids overlap on rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-pipeline-beat
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/component: beat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Service-link env vars (CHROMA_PORT=tcp://...) collide with CHROMA_*/REDIS_* settings; we use DNS.
      enableServiceLinks: false
      containers:
        - name: beat
          image: rag-pipeline/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO", "-s", "/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef:
                name: rag-pipeline-config
            - secretRef:
                name: rag-pipeline-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Measured in this image (ticket 52): cold start peak ~180 MiB, steady ~176 MiB (it imports every task module
          # through `include=`; a tick only publishes a message). The old 128Mi request under-counted it.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 200m
              memory: 384Mi
