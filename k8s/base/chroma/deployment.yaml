apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: chroma
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: chroma
  template:
    metadata:
      labels:
        app.kubernetes.io/component: chroma
    spec:
      # Service-link env vars (CHROMA_PORT=tcp://...) collide with CHROMA_*/REDIS_* settings; we use DNS.
      enableServiceLinks: false
      containers:
        - name: chroma
          image: chromadb/chroma:1.5.9  # pinned, see chroma/config.yaml
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: chroma-data
              # chromadb/chroma persists to /data (persist_path in the image's /config.yaml).
              # Mounting anywhere else silently loses every vector when the pod restarts.
              mountPath: /data
            # Replaces the image's /config.yaml (same persist_path) to bound the HNSW index cache; without it
            # Chroma keeps ~3 MiB per collection ever written to, even after deleting it (ticket 48).
            - name: chroma-config
              mountPath: /config.yaml
              subPath: config.yaml
              readOnly: true
          # Sizing rule (docs/kubernetes-local.md): memory ~= 150 MiB + 16 bytes x dimension x vectors.
          # 512Mi/1Gi covers ~40k vectors of 1024 dims; raise both for a bigger collection.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: chroma-config
          configMap:
            name: chroma-config
        - name: chroma-data
          persistentVolumeClaim:
            claimName: rag-pipeline-chroma-data

---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: rag-pipeline
spec:
  selector:
    app.kubernetes.io/component: chroma
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-pipeline-chroma-data
  namespace: rag-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi