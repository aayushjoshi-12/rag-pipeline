apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-pipeline-config
  namespace: rag-pipeline
data:
  RAG_ENV: "prod"
  DATA_DIR: "/app/data"
  CLEANUP_ORPHAN_AGE_HOURS: "24"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  VECTOR_STORE: "chroma"
  CHROMA_COLLECTION: "documents"
  # Optional vector options (docs/configuration.md); unset = store defaults. Changing them on existing data
  # needs a reindex: kubectl exec deploy/api -- python -m app.manage reindex
  # VECTOR_METRIC: "cosine"
  # VECTOR_INDEX: "hnsw"
  # HNSW_M: "16"
  # HNSW_EF_CONSTRUCTION: "64"
  # HNSW_EF_SEARCH: "40"
  # IVFFLAT_LISTS: "100"
  # IVFFLAT_PROBES: "10"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  CACHE_REDIS_URL: "redis://redis:6379/12"
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "100"
  DEFAULT_TOP_K: "5"
  RETRIEVAL_NEIGHBORS: "1"
  RETRIEVAL_MODE: "semantic"
  RETRIEVAL_KEYWORD_METHOD: "bm25"
  RETRIEVAL_FUSION: "rrf"
  RETRIEVAL_RRF_K: "60"
  RETRIEVAL_WEIGHT_SEMANTIC: "0.6"
  RETRIEVAL_WEIGHT_KEYWORD: "0.4"
  RETRIEVAL_CANDIDATES: "50"
  RETRIEVAL_KEYWORD_POOL: "200"
  BM25_K1: "1.2"
  BM25_B: "0.75"
  RETRIEVAL_FTS_CONFIG: "english"
  RETRIEVAL_DEDUPE: "true"
  MAX_UPLOAD_SIZE_BYTES: "26214400"
  PARSE_NORMALIZE_TEXT: "true"
  # File storage + ingest from links (docs/configuration.md). STORAGE_BACKEND=s3 removes the need for a
  # ReadWriteMany uploads volume when the api and worker run several replicas; credentials: secrets.yaml.
  STORAGE_BACKEND: "local"
  S3_ENDPOINT_URL: ""
  S3_BUCKET: ""
  S3_REGION: "us-east-1"
  S3_PREFIX: "rag-pipeline/"
  URL_INGEST_SCHEMES: "http,https,s3"
  URL_INGEST_S3_BUCKETS: ""
  URL_INGEST_ALLOW_PRIVATE: "false"
  URL_INGEST_TIMEOUT_SECONDS: "20"
  URL_INGEST_TOTAL_TIMEOUT_SECONDS: "120"
  URL_INGEST_MAX_REDIRECTS: "5"
  EMBEDDING_PROVIDER: "ollama"
  EMBEDDING_MODEL: "mxbai-embed-large"
  OLLAMA_BASE_URL: "http://ollama:11434"
  LLM_PROVIDER: "openrouter"
  DEFAULT_LLM_MODEL: "nvidia/nemotron-3-ultra-550b-a55b:free"
  PARSER_PROVIDER: "openrouter"
  PARSER_LLM_MODEL: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"