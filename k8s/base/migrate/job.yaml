# Run before (re)deploying the api/worker: `kubectl delete job rag-pipeline-migrate --ignore-not-found`
# then apply (Jobs are immutable). `make deploy` does both and waits for completion.
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-pipeline-migrate
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      # Service-link env vars (CHROMA_PORT=tcp://...) collide with CHROMA_*/REDIS_* settings; we use DNS.
      enableServiceLinks: false
      # `kubectl apply -k` starts Postgres and this Job together; on a real cluster the first run
      # exhausted its backoff before the db accepted connections. Wait for the port instead.
      initContainers:
        - name: wait-for-db
          image: rag-pipeline/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import socket, time
              for _ in range(120):
                  try:
                      socket.create_connection(("db", 5432), 2).close(); break
                  except OSError:
                      time.sleep(2)
              else:
                  raise SystemExit("db not reachable")
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
      containers:
        - name: migrate
          image: rag-pipeline/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: rag-pipeline-config
            - secretRef:
                name: rag-pipeline-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
