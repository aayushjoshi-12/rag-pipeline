apiVersion: v1
kind: Secret
metadata:
  name: rag-pipeline-secrets
  namespace: rag-pipeline
type: Opaque
stringData:
  # Fill via `kubectl apply` with real values (sealed-secrets/sops recommended).
  # Never commit real credentials here.
  OPENROUTER_API_KEY: "replace-me"
  DATABASE_URL: "postgresql+asyncpg://rag:rag@db:5432/rag"
  SECRET_KEY: "replace-me"