apiVersion: v1
kind: Secret
metadata:
  name: rag-pipeline-secrets
  namespace: rag-pipeline
type: Opaque
stringData:
  # Fill via `kubectl apply` with real values (sealed-secrets/sops recommended).
  # Never commit real credentials here.
  OPENROUTER_API_KEY: "replace-me"
  # Must match POSTGRES_PASSWORD below (the db pod reads it from this same Secret).
  POSTGRES_PASSWORD: "replace-me"
  DATABASE_URL: "postgresql+asyncpg://rag:replace-me@db:5432/rag"
  # JWT signing key: >= 32 random chars (e.g. `openssl rand -base64 48`). The API refuses to start
  # in prod with this placeholder.
  SECRET_KEY: "replace-me"
  # First-run bootstrap admin (only used while the users table is empty).
  ADMIN_EMAIL: "replace-me@example.com"
  ADMIN_PASSWORD: "replace-me"
  # Only needed with STORAGE_BACKEND=s3 / s3:// ingest. Leave both empty to use the pod's IAM role / default chain.
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
