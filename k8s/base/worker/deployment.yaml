apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-pipeline-worker
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: rag-pipeline/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=INFO"]
          envFrom:
            - configMapRef:
                name: rag-pipeline-config
            - secretRef:
                name: rag-pipeline-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi