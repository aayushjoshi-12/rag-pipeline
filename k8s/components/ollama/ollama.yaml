apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: rag-pipeline
  labels:
    app.kubernetes.io/name: rag-pipeline
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          # Pull the embedding model once the server is up (idempotent).
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "sleep 5; ollama pull mxbai-embed-large || true"]
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: rag-pipeline-ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: rag-pipeline
spec:
  selector:
    app.kubernetes.io/component: ollama
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-pipeline-ollama-models
  namespace: rag-pipeline
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
