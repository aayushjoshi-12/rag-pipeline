apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/ollama

# Single-node dev clusters (kind/minikube/k3s) rarely have ReadWriteMany; RWO works there because
# every pod lands on the one node.
patches:
  - target: {kind: PersistentVolumeClaim, name: rag-pipeline-uploads}
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
