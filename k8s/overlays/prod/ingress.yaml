apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-pipeline
  namespace: rag-pipeline
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
spec:
  # ingressClassName: nginx   # REQUIRED on most clusters (e.g. kind's ingress-nginx class is not the default,
  #                           # so an Ingress without it is silently ignored)
  rules:
    - host: rag.example.com   # replace
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-pipeline-frontend
                port:
                  number: 80
